<!DOCTYPE html>
<html>
<head>
    <title>Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        #score {
            font-size: 48px;
            margin: 20px;
        }

        button {
            font-size: 24px;
            padding: 15px 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Clicker Game</h1>

    <div id="score">0</div>

    <button onclick="clickGame()">
        Click Me!
    </button>

<script>
    let score = 0;
    let clickPower = 1;
    let upgradeCost = 10;

    function clickGame() {
        score += clickPower;
        updateDisplay();
    }

    function buyUpgrade() {
        if (score >= upgradeCost) {
            score -= upgradeCost;
            clickPower++;
            upgradeCost = Math.floor(upgradeCost * 1.5);
            updateDisplay();
        }
    }

    function updateDisplay() {
        document.getElementById("score").textContent = score;
        document.getElementById("power").textContent = clickPower;
        document.getElementById("cost").textContent = upgradeCost;
    }
</script>
</body>
</html>
