<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold On!</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    height:100vh;
    overflow:hidden;
    user-select:none;
}

.game{
    flex:3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.shop{
    flex:1;
    background:rgba(255,255,255,.08);
    border-left:2px solid rgba(255,255,255,.15);
    padding:20px;
    overflow-y:auto;
}

#score{
    font-size:5rem;
    color:gold;
    font-weight:bold;
}

.shop button{
    width:100%;
    margin:5px 0;
    padding:12px;
    font-size:1rem;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.shop button:hover{
    background:#1d4ed8;
}

.meter{
    width:300px;
    height:25px;
    background:#222;
    border-radius:999px;
    overflow:hidden;
    margin-top:15px;
}

.fill{
    width:0%;
    height:100%;
    background:limegreen;
}

.star{
    position:fixed;
    pointer-events:none;
    animation:floatUp 1s forwards linear;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translateY(0);
    }

    to{
        opacity:0;
        transform:translateY(-50px);
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>⭐ Hold On! ⭐</h1>

    <div id="score">0</div>

    <h2>
        Combo:
        <span id="combo">1.00</span>x
    </h2>

    <p>Hold anywhere on screen!</p>

    <div class="meter">
        <div class="fill" id="perfectMeter"></div>
    </div>

    <p>
        Perfect Hold:
        <span id="perfectPercent">0%</span>
    </p>

    <h3 id="boostStatus">
        Ready
    </h3>

</div>

<div class="shop">

    <h2>🏪 Shop</h2>

    <button onclick="buyPower()">
        +1 Hold Power
        (<span id="powerCost">10</span>)
    </button>

    <button onclick="buyMultiplier()">
        x2 Power
        (<span id="multCost">100</span>)
    </button>

    <button onclick="buyAuto()">
        Auto Holder
        (<span id="autoCost">250</span>)
    </button>

    <hr>

    <button onclick="saveGame()">
        💾 Save Game
    </button>

    <button onclick="deleteSave()">
        🗑️ Delete Save
    </button>

    <hr>

    <p>
        Hold Power:
        <span id="holdPower">1</span>
    </p>

    <p>
        Auto Holders:
        <span id="autoHolders">0</span>
    </p>

</div>

<script>

let score = 0;

let holdPower = 1;
let autoHolders = 0;

let powerCost = 10;
let multCost = 100;
let autoCost = 250;

let combo = 1;

let perfectHold = 0;
let perfectBoost = false;

let holding = null;

function loadGame(){

    const save =
        JSON.parse(
            localStorage.getItem("holdOnSave")
        );

    if(!save) return;

    score = save.score || 0;
    holdPower = save.holdPower || 1;
    autoHolders = save.autoHolders || 0;

    powerCost = save.powerCost || 10;
    multCost = save.multCost || 100;
    autoCost = save.autoCost || 250;
}

function saveGame(){

    localStorage.setItem(
        "holdOnSave",
        JSON.stringify({
            score,
            holdPower,
            autoHolders,
            powerCost,
            multCost,
            autoCost
        })
    );
}

function deleteSave(){

    localStorage.removeItem("holdOnSave");

    score = 0;
    holdPower = 1;
    autoHolders = 0;

    powerCost = 10;
    multCost = 100;
    autoCost = 250;

    combo = 1;
    perfectHold = 0;
    perfectBoost = false;

    updateDisplay();
}

function createStar(){

    const star =
        document.createElement("div");

    star.className = "star";
    star.textContent = "⭐";

    star.style.left =
        Math.random() * window.innerWidth + "px";

    star.style.top =
        Math.random() * window.innerHeight + "px";

    star.style.fontSize =
        (15 + Math.random() * 20) + "px";

    document.body.appendChild(star);

    setTimeout(() => {
        star.remove();
    },1000);
}

function startHolding(){

    if(holding) return;

    holding = setInterval(() => {

        let gain =
            holdPower * combo;

        if(perfectBoost){
            gain *= 25;
        }

        score += gain;

        combo =
            Math.min(5,
                combo + 0.02
            );

        perfectHold += 0.5;

        if(perfectHold >= 100){

            perfectHold = 0;

            perfectBoost = true;

            document
            .getElementById("boostStatus")
            .textContent =
            "🔥 PERFECT HOLD ACTIVE!";

            setTimeout(() => {

                perfectBoost = false;

                document
                .getElementById("boostStatus")
                .textContent =
                "Ready";

            },10000);
        }

        createStar();

        updateDisplay();

    },100);
}

function stopHolding(){

    clearInterval(holding);

    holding = null;

    combo = 1;

    updateDisplay();
}

document.addEventListener(
    "mousedown",
    startHolding
);

document.addEventListener(
    "mouseup",
    stopHolding
);

document.addEventListener(
    "mouseleave",
    stopHolding
);

document.addEventListener(
    "touchstart",
    startHolding
);

document.addEventListener(
    "touchend",
    stopHolding
);

function buyPower(){

    if(score >= powerCost){

        score -= powerCost;

        holdPower++;

        powerCost =
            Math.floor(powerCost * 1.5);

        updateDisplay();
    }
}

function buyMultiplier(){

    if(score >= multCost){

        score -= multCost;

        holdPower *= 2;

        multCost =
            Math.floor(multCost * 3);

        updateDisplay();
    }
}

function buyAuto(){

    if(score >= autoCost){

        score -= autoCost;

        autoHolders++;

        autoCost =
            Math.floor(autoCost * 2);

        updateDisplay();
    }
}

setInterval(() => {

    score +=
        autoHolders * holdPower;

    updateDisplay();

},1000);

setInterval(saveGame,5000);

function updateDisplay(){

    document
    .getElementById("score")
    .textContent =
    Math.floor(score);

    const comboElement =
        document
        .getElementById("combo");

    comboElement.textContent =
        combo.toFixed(2);

    if(combo >= 5){
        comboElement.style.color =
        "gold";
    }
    else if(combo >= 3){
        comboElement.style.color =
        "orange";
    }
    else{
        comboElement.style.color =
        "white";
    }

    document
    .getElementById("perfectPercent")
    .textContent =
    Math.floor(perfectHold) + "%";

    document
    .getElementById("perfectMeter")
    .style.width =
    perfectHold + "%";

    document
    .getElementById("holdPower")
    .textContent =
    holdPower;

    document
    .getElementById("autoHolders")
    .textContent =
    autoHolders;

    document
    .getElementById("powerCost")
    .textContent =
    powerCost;

    document
    .getElementById("multCost")
    .textContent =
    multCost;

    document
    .getElementById("autoCost")
    .textContent =
    autoCost;
}

loadGame();
updateDisplay();

</script>

</body>
</html>
