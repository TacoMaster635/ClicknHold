<!DOCTYPE html>
<html>
<head>
    <title>Clicker Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Clicker Game</h1>

    <h2>Score: <span id="score">0</span></h2>

    <button onclick="clickGame()">Click Me!</button>

    <hr>

    <h2>Shop</h2>

    <p>Click Power: <span id="power">1</span></p>
    <p>Upgrade Cost: <span id="cost">10</span></p>

    <button onclick="buyUpgrade()">Buy +1 Click Power</button>

    <script>
        let score = 0;
        let clickPower = 1;
        let upgradeCost = 10;

        function clickGame() {
            score += clickPower;
            updateDisplay();
        }

        function buyUpgrade() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                clickPower++;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById("score").textContent = score;
            document.getElementById("power").textContent = clickPower;
            document.getElementById("cost").textContent = upgradeCost;
        }

        updateDisplay();
    </script>

</body>
</html>
