<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold On!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    height: 100vh;
    overflow: hidden;
    user-select: none;
}

.game {
    flex: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
}

.shop {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border-left: 2px solid rgba(255,255,255,0.12);
    padding: 20px;
    overflow-y: auto;
    z-index: 10;
}

h1 {
    font-size: 3rem;
}

#score {
    font-size: 5rem;
    color: gold;
    font-weight: bold;
}

.subtitle {
    opacity: 0.7;
    margin-top: 10px;
}

.shop button {
    width: 100%;
    margin: 8px 0;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    cursor: pointer;
}

.shop button:hover {
    background: #1d4ed8;
}

.stat {
    margin-top: 10px;
}

.star {
    position: fixed;
    pointer-events: none;
    animation: floatAway 1s linear forwards;
}

@keyframes floatAway {
    from {
        opacity: 1;
        transform: translateY(0px);
    }

    to {
        opacity: 0;
        transform: translateY(-40px);
    }
}
</style>
</head>

<body>

<div class="game">
    <h1>⭐ Hold On! ⭐</h1>

    <div id="score">0</div>

    <div class="subtitle">
        Hold anywhere to earn stars!
    </div>
</div>

<div class="shop">

    <h2>🏪 Shop</h2>

    <button onclick="buyPower()">
        +1 Hold Power
        (<span id="powerCost">10</span>)
    </button>

    <button onclick="buyMultiplier()">
        x2 Power
        (<span id="multCost">100</span>)
    </button>

    <button onclick="buyAuto()">
        Auto Holder
        (<span id="autoCost">250</span>)
    </button>

    <hr>

    <div class="stat">
        Hold Power:
        <span id="holdPower">1</span>
    </div>

    <div class="stat">
        Auto Holders:
        <span id="autoHolders">0</span>
    </div>

</div>

<script>

let score = 0;

let holdPower = 1;
let autoHolders = 0;

let powerCost = 10;
let multCost = 100;
let autoCost = 250;

let holding = null;

function createStar() {

    const star = document.createElement("div");

    star.className = "star";
    star.textContent = "⭐";

    star.style.left =
        Math.random() * window.innerWidth + "px";

    star.style.top =
        Math.random() * window.innerHeight + "px";

    star.style.fontSize =
        (15 + Math.random() * 25) + "px";

    document.body.appendChild(star);

    setTimeout(() => {
        star.remove();
    }, 1000);
}

function startHolding() {

    if (holding) return;

    holding = setInterval(() => {

        score += holdPower;

        createStar();

        updateDisplay();

    }, 100);
}

function stopHolding() {

    clearInterval(holding);

    holding = null;
}

document.addEventListener("mousedown", startHolding);
document.addEventListener("mouseup", stopHolding);
document.addEventListener("mouseleave", stopHolding);

document.addEventListener("touchstart", startHolding);
document.addEventListener("touchend", stopHolding);

function buyPower() {

    if (score >= powerCost) {

        score -= powerCost;

        holdPower++;

        powerCost = Math.floor(powerCost * 1.5);

        updateDisplay();
    }
}

function buyMultiplier() {

    if (score >= multCost) {

        score -= multCost;

        holdPower *= 2;

        multCost = Math.floor(multCost * 3);

        updateDisplay();
    }
}

function buyAuto() {

    if (score >= autoCost) {

        score -= autoCost;

        autoHolders++;

        autoCost = Math.floor(autoCost * 2);

        updateDisplay();
    }
}

setInterval(() => {

    score += autoHolders * holdPower;

    updateDisplay();

}, 1000);

function updateDisplay() {

    document.getElementById("score").textContent =
        Math.floor(score);

    document.getElementById("holdPower").textContent =
        holdPower;

    document.getElementById("autoHolders").textContent =
        autoHolders;

    document.getElementById("powerCost").textContent =
        powerCost;

    document.getElementById("multCost").textContent =
        multCost;

    document.getElementById("autoCost").textContent =
        autoCost;
}

updateDisplay();

</script>

</body>
</html>
